<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>coffeefriend • fun facts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="styles.css">
    <script defer src="script.js"></script>
    <meta name="theme-color" content="#e7e2d8">
</head>
<body>
    <div class="coffee-bg" aria-hidden="true"></div>
    <div class="texture"></div>
    <header class="site-header">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">✿</span>
            <span class="brand-name">coffeefriend</span>
        </div>
        <nav>
            <a class="btn btn-outline" href="pagetwo.html">← Back</a>
        </nav>
        <button class="theme-toggle" type="button" aria-label="Toggle dusk mode">dusk</button>
    </header>

    <main class="content">
        <section class="hero card">
            <h1>Fun facts</h1>
            <p class="tagline">One new fact about coffee or other beverages each time.</p>
        </section>

        <section class="card" aria-labelledby="fact-title">
            <h2 id="fact-title">Did you know?</h2>
            <p id="random-fact">Loading a delightful fact...</p>
            <div class="actions">
                <button class="btn btn-primary" id="another-fact" type="button">Show another fact</button>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <small>Made with care and cinnamon.</small>
    </footer>

</body>
</html>
