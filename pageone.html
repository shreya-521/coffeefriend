<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>coffeefriend</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#b0823c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="coffeefriend">
    <script defer src="script.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
        });
      }
    </script>
</head>
<body>
    <div class="coffee-bg" aria-hidden="true"></div>
    <div class="texture"></div>
    <header class="site-header">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">✿</span>
            <span class="brand-name">coffeefriend</span>
        </div>
        <button class="theme-toggle" type="button" aria-label="Toggle dusk mode">dusk</button>
    </header>

    <main class="content">
        <section class="hero card">
            <div class="vines" aria-hidden="true">
                <span class="leaf leaf-1"></span>
                <span class="leaf leaf-2"></span>
                <span class="leaf leaf-3"></span>
            </div>
            <h1>Hey there ☕</h1>
            <p class="tagline">How would you like your coffee today?</p>
            <div class="actions">
                <a class="btn btn-primary" href="pagetwo.html">Today's Coffee Mood</a>
                <button id="install-app" class="btn btn-outline" type="button" style="display:none;">Install app</button>
                <div class="dropdown">
                    <button class="btn btn-outline dropdown-toggle" type="button" aria-haspopup="true" aria-expanded="false">Explore more ▾</button>
                    <div class="dropdown-menu" role="menu">
                        <a class="dropdown-item" role="menuitem" href="pagethree.html">Items that pair well with coffee</a>
                        <a class="dropdown-item" role="menuitem" href="pagefour.html">Fun facts about coffee & beverages</a>
                    </div>
                </div>
            </div>
            <ul class="notes">
                <li>Enjoy your coffee.</li>
                <li>Words cannot espresso how much coffee beans to me</li>
                <li>Better Latte than never.</li>
                
                
            </ul>
        </section>

        

    </main>

    <footer class="site-footer">
        <small>Made with care and cinnamon.</small>
    </footer>

</body>
</html>
